<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caixa em Dia</title>
<meta name="description" content="Controle financeiro da casa">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13201B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caixa em Dia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: app shell — sticky header with month switcher, tab rail, one working column of panels; card due dates drawn as perforated "boleto" tickets. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EFEB; --line:#D3DDD7; --line-2:#BFCCC5;
  --ink:#12231D; --ink-2:#44564F; --ink-3:#6C7D76;
  --accent:#0E6B59; --accent-ink:#FFFFFF; --accent-soft:#D3ECE4; --coin:#E2A93B;
  --good:#17714A; --good-bg:#DDF2E6; --bad:#B42318; --bad-bg:#FCE6E2; --warn:#8A5A00; --warn-bg:#FBEFD3;
  --c-ess:#1E8A5A; --c-com:#3B6FB6; --c-red:#B87A00; --c-cor:#B8325F; --c-none:#8C9893; --c-loan:#7A4FB0;
  --shadow:0 1px 2px rgba(18,35,29,.06),0 6px 20px -12px rgba(18,35,29,.25);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1512; --surface:#13201B; --surface-2:#1A2A24; --line:#283A33; --line-2:#364C44;
  --ink:#E4EEEA; --ink-2:#A8BAB2; --ink-3:#7E918A;
  --accent:#4FC3A5; --accent-ink:#062019; --accent-soft:#163A31; --coin:#E9B654;
  --good:#5CCB92; --good-bg:#12301F; --bad:#FF8B7B; --bad-bg:#3B1713; --warn:#E6B24D; --warn-bg:#33270E;
  --c-ess:#3FA877; --c-com:#5B8DD6; --c-red:#B8820F; --c-cor:#E0628A; --c-none:#7E8A85; --c-loan:#A483D6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1512; --surface:#13201B; --surface-2:#1A2A24; --line:#283A33; --line-2:#364C44;
  --ink:#E4EEEA; --ink-2:#A8BAB2; --ink-3:#7E918A;
  --accent:#4FC3A5; --accent-ink:#062019; --accent-soft:#163A31; --coin:#E9B654;
  --good:#5CCB92; --good-bg:#12301F; --bad:#FF8B7B; --bad-bg:#3B1713; --warn:#E6B24D; --warn-bg:#33270E;
  --c-ess:#3FA877; --c-com:#5B8DD6; --c-red:#B8820F; --c-cor:#E0628A; --c-none:#7E8A85; --c-loan:#A483D6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6); color-scheme:dark}

:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
h1,h2,h3{font-family:var(--f-display);font-stretch:88%;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink-3)}
.small{font-size:.84rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:50%;background:var(--coin);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#2B1D00;font-size:.8rem;font-stretch:80%;box-shadow:inset 0 0 0 3px rgba(0,0,0,.08)}
.brand h1{font-size:1.25rem;font-weight:800;font-stretch:75%;letter-spacing:.01em;text-transform:uppercase}
.save{font-size:.76rem;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;border:0}
.save.db{background:var(--good-bg);color:var(--good)}
.save.demo{background:var(--warn-bg);color:var(--warn)}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:999px;padding:3px}
.monthnav button{border:0;background:transparent;width:32px;height:32px;border-radius:50%;font-size:1.1rem;color:var(--ink-2)}
.monthnav button:hover{background:var(--surface)}
.monthnav .cur{min-width:118px;text-align:center;font-family:var(--f-display);font-weight:700;font-stretch:90%;font-size:1.02rem;text-transform:capitalize;border-radius:999px;width:auto;padding:0 10px;color:var(--ink)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:10px 12px 11px;font-weight:600;color:var(--ink-3);white-space:nowrap;border-bottom:2px solid transparent;border-radius:0}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}

main{padding-block:18px 120px}
.stack{display:grid;gap:18px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner p{margin:0;flex:1 1 260px;min-width:0}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.banner.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}

.btn{text-decoration:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:.84rem;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:stretch}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.big{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.big .value{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:clamp(2.2rem,6vw,3.3rem);line-height:1;letter-spacing:-.02em}
.big .value.neg{color:var(--bad)}
.big .value.pos{color:var(--good)}
.big .value.na{color:var(--ink-3);font-size:clamp(1.6rem,4vw,2.2rem)}
.big p{margin:0;color:var(--ink-2);font-size:.9rem;max-width:52ch}
.split{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.86rem;color:var(--ink-2)}
.split b{color:var(--ink)}
.eq{display:grid;grid-template-columns:1fr auto;gap:2px 14px;margin-top:8px;font-size:.92rem}
.eq dt{color:var(--ink-2)} .eq dd{margin:0;text-align:right}
.eq .tot{border-top:1px solid var(--line);padding-top:6px;margin-top:4px;font-weight:700;color:var(--ink)}
.eq .soft{color:var(--ink-3)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .v{font-family:var(--f-display);font-weight:700;font-stretch:85%;font-size:1.45rem;line-height:1.1}
.stat .link{align-self:flex-start;margin-top:auto}
.bigv{font-family:var(--f-display);font-weight:800;font-stretch:82%;font-size:1.7rem;line-height:1.1}

/* tickets (faturas) */
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.ticket{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;overflow:hidden}
.ticket .tk-top{padding:12px 14px 10px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ticket .tk-name{font-weight:700}
.ticket .tk-due{font-size:.76rem;color:var(--ink-3);text-align:right;line-height:1.25}
.ticket .tk-due b{display:block;font-family:var(--f-display);font-size:1.15rem;color:var(--ink);font-stretch:85%}
.ticket .tk-mid{padding:0 14px 12px;display:flex;flex-direction:column;gap:2px}
.ticket .tk-amt{font-family:var(--f-display);font-weight:800;font-stretch:82%;font-size:1.6rem}
.ticket .tk-bot{border-top:1.5px dashed var(--line-2);padding:10px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.86rem;position:relative;flex-wrap:wrap}
.ticket .tk-bot::before,.ticket .tk-bot::after{content:"";position:absolute;top:-8px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket .tk-bot::before{left:-8px} .ticket .tk-bot::after{right:-8px}
.ticket .tk-act{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.ticket.bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.ticket.bad .tk-bot{background:var(--bad-bg)}
.ticket.good .tk-bot{background:var(--good-bg)}
.ticket.paid .tk-bot{background:var(--surface-2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}

/* chart */
.chart{position:relative;width:100%;min-height:240px}
.chart svg{display:block;width:100%;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:.8rem;line-height:1.35;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .12s}
.chart .tip.on{opacity:1}
.axis{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}
.grid line{stroke:var(--line);stroke-width:1}

/* bars */
.stackbar{display:flex;gap:2px;height:16px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.stackbar button{border:0;padding:0;height:100%;min-width:3px}
.legend{display:grid;gap:2px;margin-top:12px}
.legend button{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;border:0;background:transparent;padding:6px 6px;border-radius:6px;text-align:left}
.legend button:hover{background:var(--surface-2)}
.legend .hint{color:var(--ink-3);font-size:.8rem}
.hbars{display:grid;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(0,9.5rem) minmax(0,1fr) auto;gap:10px;align-items:center;border:0;background:transparent;padding:2px 0;text-align:left;width:100%}
.hbar .track{height:10px;background:var(--surface-2);border-radius:0 4px 4px 0;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.hbar:hover .fill{filter:brightness(1.12)}
.hbar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88rem}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;align-items:end;height:160px;padding-top:18px}
.col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.col .bars{width:100%;max-width:34px;display:flex;flex-direction:column;border-radius:4px 4px 0 0;overflow:hidden;min-height:2px}
.col .bars i{display:block;min-height:0}
.col .t{font-size:.68rem;color:var(--ink-3);white-space:nowrap}
.col .val{font-size:.62rem;color:var(--ink-2);white-space:nowrap}
.keys{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin-top:10px}
.keys span{display:inline-flex;gap:6px;align-items:center}

/* lists */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.84rem;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.filters{display:grid;gap:10px}
.filters .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.88rem;min-width:0;max-width:100%}
.rows{display:grid}
.dayhead{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:12px 4px 6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.row-i{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:10px 6px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%;align-items:center}
.row-i:hover{background:var(--surface-2)}
.row-i .d{font-weight:600;overflow-wrap:anywhere}
.row-i .m{grid-column:1;font-size:.8rem;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row-i .a{grid-row:1/span 2;grid-column:2;text-align:right;font-weight:700}
.row-i .a.in{color:var(--good)}
.row-i .a.mv{color:var(--ink-3)}
.tag{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-2)}
.tag.cut-ess{color:var(--c-ess)} .tag.cut-com{color:var(--c-com)} .tag.cut-red{color:var(--c-red)} .tag.cut-cor{color:var(--c-cor)}
.tag.last{background:var(--good-bg);color:var(--good)}
.tag.who{background:transparent;border:1px solid var(--line);color:var(--ink-3);font-weight:600}
.empty{padding:28px 10px;text-align:center;color:var(--ink-3)}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:700;background:var(--surface-2);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--surface-2)}
tr.sel td{background:var(--accent-soft)}
tfoot td{font-weight:700;background:var(--surface-2)}
td.na{color:var(--ink-3)}
.neg{color:var(--bad)} .pos{color:var(--good)}

/* contas */
.acctgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.acard{display:flex;flex-direction:column;gap:4px}
.acard .panel-h{margin-bottom:6px}

/* forms */
dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 32px);box-shadow:0 20px 60px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(8,18,14,.5)}
.sheet{display:flex;flex-direction:column;max-height:calc(100dvh - 32px)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px}
.sheet-b{padding:16px 18px;overflow:auto;display:grid;gap:14px}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex-wrap:wrap}
.sheet-f .spacer{margin-right:auto}
.x{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:50%;font-size:1.1rem;color:var(--ink-2)}
.fld{display:grid;gap:5px;min-width:0;align-content:start}
.fld>span{font-size:.8rem;font-weight:600;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.fld textarea{min-height:140px;resize:vertical;font-size:.86rem}
.help{font-size:.78rem;color:var(--ink-3);margin:0}
.money-in{font-family:var(--f-display);font-size:1.7rem !important;font-weight:700;font-stretch:85%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:460px){.three{grid-template-columns:1fr 1fr}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.84rem;font-weight:600;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.check{display:flex;gap:9px;align-items:center;font-weight:600;font-size:.9rem}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.sub{border-left:3px solid var(--line);padding-left:12px;display:grid;gap:12px}
.typetabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--surface-2);padding:3px;border-radius:9px}
.typetabs button{border:0;background:transparent;padding:7px 6px;border-radius:7px;font-weight:600;font-size:.84rem;color:var(--ink-2)}
.typetabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.calc{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.88rem;display:grid;gap:6px}
.calc:empty{display:none}
.mchips{display:flex;flex-wrap:wrap;gap:4px}
.mchip{font-size:.72rem;padding:2px 7px;border-radius:4px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.mchip.now{border-color:var(--accent);color:var(--accent);font-weight:700}

  return R;
}

function buildState(recs){
  const st={start:curYM(),reduce:{...RED_DEFAULT},people:[],accounts:[],cards:[],incomes:[],fixed:[],items:[],transfers:[],loans:[],invs:[],moves:[],confs:[],bills:{},closed:{}};
  const by={pes:'people',cta:'accounts',car:'cards',ent:'incomes',fix:'fixed',gas:'items',tra:'transfers',emp:'loans',inv:'invs',mov:'moves',con:'confs'};
  for(const r of Object.values(recs)){
    if(r.t==='cfg'){if(isYM(r.start))st.start=r.start;if(r.reduce&&typeof r.reduce==='object')st.reduce={...RED_DEFAULT,...r.reduce};continue}
    if(r.t==='fat'){st.bills[r.card+':'+r.ym]=r;continue}
    if(r.t==='mes'){st.closed[r.ym]=r;continue}
    const k=by[r.t];if(k)st[k].push(r);
  }
  const ord=(a,b)=>(a.o??1e9)-(b.o??1e9)||(a.c||0)-(b.c||0);
  st.people.sort(ord);st.accounts.sort(ord);st.cards.sort(ord);st.invs.sort(ord);
  return st;
}

/* ---------- motor de cálculo ---------- */
const acc=id=>S.st.accounts.find(a=>a.id===id);
const card=id=>S.st.cards.find(c=>c.id===id);
const person=id=>S.st.people.find(p=>p.id===id);
const invOf=id=>S.st.invs.find(x=>x.id===id);
const myPid=()=>(S.st.people.find(p=>p.uid&&p.uid===S.me)||S.st.people[0])?.id||'';
const pname=id=>id?(person(id)?.name||'—'):'Os dois / casa';
const isWallet=a=>!!a&&a.type==='carteira';
const firstBank=()=>(S.st.accounts.find(a=>!isWallet(a))||S.st.accounts[0])?.id||'';
const defPay=()=>firstBank()?'a:'+firstBank():'';
function pay(p){if(!p)return null;const[t,id]=p.split(':');if(t==='c'){const c=card(id);return c?{type:'card',card:c,acc:acc(c.accountId),name:c.name}:null}const a=acc(id);return a?{type:'acc',acc:a,name:a.name}:null}
const closeDayOf=c=>c.rule==='last'?(+c.day||1)+1:(+c.day||1);
function cardDue(c,date){const d=+date.slice(8,10),cd=closeDayOf(c);const close=d<cd?ymOf(date):addM(ymOf(date),1);const nx=c.dueNext==='same'?0:c.dueNext==='next'?1:(+c.dueDay>=cd?0:1);return addM(close,nx)}
function cardRuleText(c){return (c.rule==='last'?`Compras até o dia ${c.day}`:`Fecha no dia ${c.day}`)+` · vence dia ${c.dueDay}`}
function cardExample(c){
  const ym=curYM(),cd=closeDayOf(c);
  const due=d=>{const f=cardDue(c,d);return `fatura de ${ymL(f)}, vence ${fD(dateIn(f,c.dueDay))}`};
  if(cd>lastDay(ym))return `Toda compra de ${ymL(ym)} entra na ${due(dateIn(ym,1))}.`;
  const parts=[];if(cd>1){const a=dateIn(ym,cd-1);parts.push(`Compra em ${fD(a)} → ${due(a)}.`)}
  const b=dateIn(ym,cd);parts.push(`Compra em ${fD(b)} → ${due(b)}.`);return parts.join(' ');
}
function firstYM(it){if(it.bill)return it.bill;const p=pay(it.pay);return p&&p.type==='card'?cardDue(p.card,it.date):ymOf(it.date)}
function lastYM(it){const t=it.inst?.tot||1,c=it.inst?.cur||1;return addM(firstYM(it),t-c)}
function instAmt(x,n){const tot=x.inst?.tot||1;if(x.total&&tot>1){const cents=Math.round(x.total*100),base=Math.floor(cents/tot),rem=cents-base*tot;return (base+(n===1?rem:0))/100}return +x.amount}

function lines(m,red){return memo('L'+m+(red?'r':''),()=>{
  const st=S.st,L=[],P=o=>{L.push(o);return o};

    if(k<0||cur+k>tot)continue;
    const n=cur+k;let date;
    if(p?.type==='card')date=dateIn(m,p.card.dueDay);else date=k===0&&ymOf(x.date)===m?x.date:dateIn(m,+x.date.slice(8,10));
    const ln=P({kind:'var',dir:-1,src:x,desc:x.desc,cat:x.cat,person:x.personId,acc:p?.acc?.id||null,card:p?.type==='card'?p.card.id:null,payKey:x.pay,via:p?.name||'—',date,buy:x.date,amount:instAmt(x,n),cut:x.cut||(tot>1?'com':null),inst:tot>1?{n,tot}:null});
    if(x.refund&&+x.refund.amount>0&&(tot>1||k===0)){
      ln.refund={who:x.refund.who||'alguém',amount:+x.refund.amount,received:!!x.refund.received};
      if(x.refund.received)P({kind:'dev',dir:1,src:x,desc:`Devolução de ${x.refund.who||'alguém'} · ${x.desc}`,cat:'Devolução',person:x.personId,acc:ln.acc,via:ln.via,date:ln.date,amount:+x.refund.amount});
    }
  }
  for(const x of st.loans){
    if(isDate(x.date)&&ymOf(x.date)===m&&+x.amount>0)P({kind:'loanin',dir:1,src:x,desc:x.desc,cat:'Empréstimo recebido',person:x.personId,acc:x.accId,via:acc(x.accId)?.name||'—',date:x.date,amount:+x.amount});
    if(!isYM(x.first))continue;
    const p=pay(x.pay),k=diffM(x.first,m),n=(+x.cur||1)+k;
    if(k<0||n>+x.n||!(+x.parcela>0))continue;
    const date=p?.type==='card'?dateIn(m,p.card.dueDay):x.day?dateIn(m,x.day):null;
    P({kind:'loan',dir:-1,src:x,desc:x.desc,cat:'Consórcio/Empréstimo',person:x.personId,acc:p?.acc?.id||null,card:p?.type==='card'?p.card.id:null,payKey:x.pay,via:p?.name||'—',date,amount:+x.parcela,cut:'com',inst:{n,tot:+x.n}});
  }

    const a=acc(x.from),b=acc(x.to),base={kind:'tr',src:x,desc:x.desc||trName(a,b),cat:'Transferência',person:'',via:`${a?.name||'—'} → ${b?.name||'—'}`,date:x.date,amount:+x.amount};

    if(inM)for(const l of L)if(l.card===cd.id)l.date=b.date;

    if(Math.abs(diff)>=0.01)P({kind:'fd',dir:diff>0?-1:1,src:b,desc:`Diferença na fatura do ${cd.name}`,cat:'Ajuste de fatura',person:'',acc:cd.accountId,via:cd.name,date:inM?b.date:dateIn(m,cd.dueDay),amount:Math.abs(diff)});
  }

})}
const expVal=l=>l.kind==='fd'?-val(l):l.amount;
function summary(m,red){return memo('S'+m+(red?'r':''),()=>{
  const L=lines(m,red),K=k=>sum(L.filter(l=>l.kind===k),l=>l.amount);
  const inT=K('in'),dev=K('dev'),fix=K('fix'),fd=sum(L.filter(l=>l.kind==='fd'),expVal),vr=K('var')+fd,loanP=K('loan'),loanIn=K('loanin'),apl=K('apl'),res=K('res'),aj=sum(L.filter(l=>l.kind==='aj'),val);
  const out=fix+vr+loanP,result=inT+dev-out,cash=result+loanIn+res-apl+aj;
  const receber=sum(L.filter(l=>l.refund&&!l.refund.received),l=>l.refund.amount);
  const inst=sum(L.filter(l=>l.kind==='var'&&l.inst),l=>l.amount);
  return{m,L,inT,dev,fix,fd,vr,loanP,loanIn,apl,res,aj,out,result,cash,receber,inst};
})}
function gateOK(m){const st=S.st;if(m<st.start)return false;for(let q=st.start;q<m;q=addM(q,1))if(!st.closed[q]&&q!==curYM())return false;return true}
function delta(m){return memo('D'+m,()=>{const o={};for(const l of lines(m))if(l.acc)o[l.acc]=(o[l.acc]||0)+val(l);return o})}
function runStart(m){return memo('R'+m,()=>{
  const st=S.st,o={};
  if(m<=st.start){for(const a of st.accounts)o[a.id]=+a.initial||0;return o}
  const p=addM(m,-1),prev=runStart(p),d=delta(p);
  for(const a of st.accounts)o[a.id]=(prev[a.id]||0)+(d[a.id]||0);
  const cl=st.closed[p];if(cl&&cl.legacyReal!=null&&st.accounts[0]){const tot=sum(Object.values(o));o[st.accounts[0].id]+=cl.legacyReal-tot}

function endAcc(m){const s=runStart(m),d=delta(m),o={};for(const a of S.st.accounts)o[a.id]=(s[a.id]||0)+(d[a.id]||0);return o}
function splitTypes(map){let bank=0,wal=0;for(const a of S.st.accounts){const v=map[a.id]||0;if(isWallet(a))wal+=v;else bank+=v}return{bank,wal}}
function carry(m){return gateOK(m)?sum(Object.values(runStart(m))):null}
function allowed(m){return carry(m)!==null}
function whyNoCarry(m){
  const st=S.st;if(m<st.start)return `Este mês é anterior ao início do controle (${ymL(st.start)}).`;
  for(let q=st.start;q<m;q=addM(q,1))if(!st.closed[q]&&q!==curYM())return `A sobra só passa de um mês para o seguinte. Feche ${ymL(q)} para ver o que sobra para cá.`;
  return `A sobra de ${ymL(addM(m,-1))} só aparece quando ${ymL(addM(m,-1))} for fechado.`;
}
function balanceAt(accId,date,exclConf){
  const ym=ymOf(date),eom=date===dateIn(ym,lastDay(ym));let v=runStart(ym)[accId]||0;
  for(const l of lines(ym)){if(l.acc!==accId)continue;if(l.kind==='aj'&&l.src.id===exclConf)continue;if(l.date?l.date<=date:eom)v+=val(l)}
  return v;
}
function flow(m,red){
  const s=summary(m,red),ok=gateOK(m),n=lastDay(m),st0=ok?runStart(m):{},days=[];
  let{bank,wal}=ok?splitTypes(st0):{bank:0,wal:0};const base=bank+wal,b0=bank,w0=wal;
  const byDay={};for(const l of s.L){if(l.date&&ymOf(l.date)===m)(byDay[l.date]=byDay[l.date]||[]).push(l)}
  for(let d=1;d<=n;d++){const ds=dateIn(m,d);let i=0,o=0;
    for(const l of byDay[ds]||[]){const v=val(l);if(l.kind!=='tr'){if(v>0)i+=v;else o-=v}if(isWallet(acc(l.acc)))wal+=v;else bank+=v}
    days.push({d,ds,i,o,bal:bank+wal,bank,wal})}
  const und=s.L.filter(l=>!l.date&&l.kind!=='tr');
  const undIn=sum(und.filter(l=>l.dir>0),l=>l.amount),undOut=sum(und.filter(l=>l.dir<0),l=>l.amount);
  const cards=S.st.cards.map(cd=>{const inv=s.L.inv[cd.id]||0,bill=S.st.bills[cd.id+':'+m];if(!inv&&!bill)return null;
    const due=bill&&isDate(bill.date)&&ymOf(bill.date)===m?bill.date:dateIn(m,cd.dueDay);return{card:cd,inv,due,bill,bal:days[+due.slice(8)-1].bank}}).filter(Boolean);
  return{days,base,b0,w0,hasCarry:ok,undIn,undOut,cards};
}
function accPanel(m){
  const s=summary(m),ok=gateOK(m),st0=runStart(m);
  const rows=S.st.accounts.map(a=>{const L=s.L.filter(l=>l.acc===a.id);const i=sum(L.filter(l=>l.dir>0),l=>l.amount),o=sum(L.filter(l=>l.dir<0),l=>l.amount);
    const start=st0[a.id]||0;return{a,i,o,net:i-o,start,end:start+i-o}});
  const key=ok?'end':'net';
  const neg=rows.filter(x=>x[key]<-0.005).map(x=>({...x,need:-x[key]})).sort((a,b)=>b.need-a.need),pos=rows.filter(x=>x[key]>0.005).map(x=>({...x,have:x[key]})).sort((a,b)=>b.have-a.have);
  const tr=[];for(const n of neg){for(const p of pos){if(n.need<=0.005)break;if(p.have<=0.005)continue;const v=Math.min(n.need,p.have);tr.push({from:p.a,to:n.a,v});n.need-=v;p.have-=v}}
  return{rows,tr,ok,uncovered:sum(neg,n=>n.need)};
}
function portfolio(upTo,excl){
  const o={};for(const i of S.st.invs)o[i.id]={inv:i,apl:0,res:0,ren:0,saldo:0};
  for(const x of S.st.moves){if(x.id===excl)continue;if(upTo&&x.date>upTo)continue;const r=o[x.invId];if(!r||!r.hasOwnProperty(x.kind))continue;r[x.kind]+=+x.amount||0}
  for(const r of Object.values(o))r.saldo=r.apl-r.res+r.ren;return o;
}
function loanInfo(x,m){
  const tot=+x.n,cur=+x.cur||1,k=isYM(x.first)?diffM(x.first,m):-1,n=cur+k,end=isYM(x.first)?addM(x.first,tot-cur):null;
  const totalPay=(+x.parcela||0)*tot,juros=+x.amount>0?totalPay-x.amount:null,i=+x.amount>0?rateMonthly(+x.amount,+x.parcela,tot):null;
  const fromN=Math.max(n,cur),left=fromN<=tot?(tot-fromN+1)*(+x.parcela||0):0;
  return{tot,cur,n,end,totalPay,juros,i,active:k>=0&&n<=tot,left,done:n>tot};
}

/* ---------- persistência ---------- */
const LS1='caixa-em-dia:v1',LS2='caixa-em-dia:v2';
function lsGet(k){try{const s=localStorage.getItem(k);return s?JSON.parse(s):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
const DB={db:null,subs:{},unsubs:{},chain:{},pw:{},pd:{}};
function recPath(r){return DATED[r.t]&&isDate(r.date)?`ano/${r.date.slice(0,4)}/reg/${r.id}`:`casa/${r.id}`}
const subKey=path=>path.startsWith('casa/')?'casa':path.split('/').slice(0,3).join('/');
function body(r){const o={};for(const[k,v]of Object.entries(r)){if(k==='id'||v===undefined)continue;o[k]=v}return toFS(o)}
/* o Firestore não aceita "/" em nomes de campo: as reduções por categoria vão como lista */
const toFS=b=>b.reduce&&!Array.isArray(b.reduce)?{...b,reduce:Object.entries(b.reduce).map(([c,v])=>({c,v}))}:b;
const fromFS=b=>b&&Array.isArray(b.reduce)?{...b,reduce:Object.fromEntries(b.reduce.map(x=>[x.c,x.v]))}:b;
function setRecs(list){S.recs={};for(const r of list)if(r&&r.id&&r.t)S.recs[r.id]=r;rebuild()}
function rebuild(){S.st=buildState(S.recs);invalidate();scheduleRender();resolveNames()}
function stamp(r){r={...r};if(!r.id)r.id=uid();if(!r.c)r.c=Date.now();if(S.me&&!r.by&&S.mode!=='demo')r.by=S.me;return r}
function put(r,msg){
  if(S.ro&&S.mode!=='demo'){toast(RO_MSG);return false}
  r=stamp(r);const old=S.recs[r.id];S.recs[r.id]=r;rebuild();if(msg)toast(msg);
  if(S.mode==='local')saveLocal();
  else if(S.mode==='db'&&DB.db){const p=recPath(r),op=old?recPath(old):null;if(op&&op!==p)dbDel(op);ensureSub(subKey(p));delete DB.pd[r.id];DB.pw[r.id]=r;dbSet(p,body(r)).finally(()=>{if(DB.pw[r.id]===r)delete DB.pw[r.id]})}
  return true;
}
function drop(id,msg){
  if(S.ro&&S.mode!=='demo'){toast(RO_MSG);return}
  const old=S.recs[id];if(!old)return;delete S.recs[id];rebuild();if(msg)toast(msg);
  if(S.mode==='local')saveLocal();else if(S.mode==='db'&&DB.db){delete DB.pw[id];DB.pd[id]=1;dbDel(recPath(old)).finally(()=>{delete DB.pd[id]})}
}
async function putMany(list){
  list=list.map(stamp);for(const r of list)S.recs[r.id]=r;rebuild();
  if(S.mode==='local'){saveLocal();return}
  if(S.mode!=='db'||!DB.db)return;
  const q=list.slice();const worker=async()=>{while(q.length){const r=q.shift(),p=recPath(r);ensureSub(subKey(p));DB.pw[r.id]=r;await dbSet(p,body(r));if(DB.pw[r.id]===r)delete DB.pw[r.id]}};
  await Promise.all([worker(),worker(),worker(),worker()]);
}
function saveLocal(){if(!lsSet(LS2,{v:2,recs:Object.values(S.recs)}))toast('Este navegador não deixou salvar. Baixe um backup em Ajustes.')}
function dbOp(path,fn){
  const run=()=>fn().catch(e=>{if(e&&e.code==='unavailable')return new Promise(r=>setTimeout(r,700+Math.random()*1300)).then(fn);throw e});
  const p=(DB.chain[path]||Promise.resolve()).then(run).catch(dbFail);DB.chain[path]=p;return p;
}
const dbSet=(path,data)=>dbOp(path,()=>DB.db.doc(path).set(data));
const dbDel=path=>dbOp(path,()=>DB.db.doc(path).delete());
let failT=0;
function dbFail(e){const c=e&&e.code;

  else if(c==='permission-denied')toast('Sem permissão para salvar. Confira se você ainda está na casa.');

}
function ensureSub(key){

function subscribeAll(){
  ensureSub('casa');const sy=+S.st.start.slice(0,4),cy=+curYM().slice(0,4);

function onSnap(key,snap){

function mergeSubs(){

  if(S.mode!=='db'){if(!Object.keys(u).length)return;S.mode='db';S.recs={}}
  for(const r of Object.values(S.recs)){const k=subKey(recPath(r));if(!(k in DB.subs))u[r.id]=r}
  for(const id of Object.keys(DB.pd))delete u[id];for(const r of Object.values(DB.pw))u[r.id]=r;

function linkMe(){

function resolveNames(){}
function stateFromDocsV1(docs){let cfg=null,items=[];for(const d of docs){const b=d.data();if(!b)continue;if(d.id==='config')cfg=b.d;else if(d.id.startsWith('items-')&&Array.isArray(b.items))items=items.concat(b.items)}return cfg?{...cfg,items}:null}
/* ---------- Firebase: login e casa ---------- */
let FB=null;
const LSC=uid=>'caixa-em-dia:casa:'+uid;
function fbInit(){
  if(typeof firebase==='undefined'){S.phase='offline';render();return}
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||/COLE/.test(cfg.apiKey)){S.phase='config';render();return}
  firebase.initializeApp(cfg);
  const fs=firebase.firestore(),auth=firebase.auth();
  if(cfg.emulator){auth.useEmulator('http://127.0.0.1:9099');fs.useEmulator('127.0.0.1',8080)}
  try{fs.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  auth.languageCode='pt-BR';
  FB={auth,fs};
  auth.onAuthStateChanged(u=>{onUser(u)});
}
function stopAll(){
  for(const f of Object.values(DB.unsubs))try{f()}catch(e){}
  if(DB.casaUnsub){try{DB.casaUnsub()}catch(e){}DB.casaUnsub=null}
  DB.unsubs={};DB.subs={};DB.chain={};DB.pw={};DB.pd={};DB.db=null;
  S.cid=null;S.casa=null;S.invite=null;S.names={};S.dbChecked=false;S.linked=false;S.mode='demo';

let userSeq=0;
async function onUser(u){
  const seq=++userSeq;stopAll();S.fb=u;
  if(!u){if(S.me)S.authMode='login';S.me=null;S.phase='login';render();return}
  S.me=u.uid;S.uname=u.displayName||S.uname||'';S.phase='loading';render();
  let cid=null;
  try{const d=await FB.fs.doc('usuarios/'+u.uid).get();if(d.exists){const b=d.data();cid=b.casa||null;if(b.nome)S.uname=b.nome}}
  catch(e){cid=lsGet(LSC(u.uid))}

  if(cid&&await enterCasa(cid,seq))return;
  if(seq!==userSeq)return;

}
async function enterCasa(cid,seq){

async function openCasa(cid){

async function createCasa(nome){

async function joinCasa(code){
  if(code.length<6)throw{code:'codigo'};
  const nm=gateName();
  const inv=await FB.fs.doc('convites/'+code).get();
  if(!inv.exists)throw{code:'codigo'};
  const v=inv.data();if(v.expira&&v.expira.toMillis()<Date.now())throw{code:'vencido'};
  await FB.fs.doc('casas/'+v.casa).update({membros:firebase.firestore.FieldValue.arrayUnion(S.me),['nomes.'+S.me]:nm,convite:code});
  await FB.fs.doc('usuarios/'+S.me).set({casa:v.casa,nome:nm});
  FB.fs.doc('convites/'+code).delete().catch(()=>{});
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  await enterCasa(v.casa);
}

function authMsg(e){const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return 'E-mail ou senha errados.';
  if(/invalid-email/.test(c))return 'Esse e-mail não parece certo.';
  if(/missing-password/.test(c))return 'Digite a senha.';
  if(/email-already-in-use/.test(c))return 'Já existe uma conta com esse e-mail. Toque em "Já tenho conta" e entre.';
  if(/weak-password/.test(c))return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/too-many-requests/.test(c))return 'Muitas tentativas seguidas. Espere alguns minutos.';
  if(/network-request-failed|unavailable/.test(c))return 'Sem internet. Confira a conexão e tente de novo.';
  if(c==='nome')return 'Diga seu nome.';
  if(c==='codigo')return 'Código não encontrado. Confira as letras ou peça um novo.';
  if(c==='vencido')return 'Esse código venceu. Peça um novo.';
  if(/permission-denied/.test(c))return 'Sem permissão. Confira se as regras do banco foram publicadas (passo 3 do LEIAME).';

}

function flowTable(fl){return `<div class="tablewrap" style="margin-top:12px;max-height:340px"><table><thead><tr><th>Dia</th><th>Entra</th><th>Sai</th><th>Banco</th><th>Carteira</th><th>Total</th></tr></thead><tbody><tr><td>Início</td><td></td><td></td><td class="num">${fl.hasCarry?money(fl.b0):'—'}</td><td class="num">${fl.hasCarry?money(fl.w0):'—'}</td><td class="num">${fl.hasCarry?money(fl.base):'—'}</td></tr>${fl.days.filter((d,i)=>d.i||d.o||d.bank!==(i?fl.days[i-1].bank:fl.b0)).map(d=>`<tr><td>${fD(d.ds)} ${wday(d.ds)}</td><td class="num pos">${d.i?money(d.i):''}</td><td class="num">${d.o?money(d.o):''}</td><td class="num ${d.bank<0?'neg':''}">${money(d.bank)}</td><td class="num ${d.wal<0?'neg':''}">${money(d.wal)}</td><td class="num ${d.bal<0?'neg':''}">${money(d.bal)}</td></tr>`).join('')}</tbody></table></div>`}

    ${xt}<line id="xh" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--ink-2)" opacity="0"/><circle id="xp" r="5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2" opacity="0"/>
    <rect x="${pl}" y="0" width="${W-pl-pr}" height="${H}" fill="transparent" id="hit"/></svg><div class="tip" id="tip"></div>

  const hit=box.querySelector('#hit'),tip=box.querySelector('#tip'),xh=box.querySelector('#xh'),xp=box.querySelector('#xp');
  const mv=e=>{const r=box.querySelector('svg').getBoundingClientRect(),x=(e.clientX-r.left)*(W/r.width);let d=Math.round((x-pl)/((W-pl-pr)/n)+0.5);d=Math.max(1,Math.min(n,d));const o=fl.days[d-1],px=X(d),py=Y(o.bal);
    xh.setAttribute('x1',px);xh.setAttribute('x2',px);xh.setAttribute('opacity','.35');xp.setAttribute('cx',px);xp.setAttribute('cy',py);xp.setAttribute('opacity','1');

const KINDF={in:l=>l.kind==='in'||l.kind==='dev',fix:l=>l.kind==='fix',var:l=>(l.kind==='var'&&!l.inst)||l.kind==='fd',inst:l=>l.kind==='var'&&!!l.inst,loan:l=>l.kind==='loan'||l.kind==='loanin',tr:l=>l.kind==='tr',inv:l=>l.kind==='apl'||l.kind==='res',aj:l=>l.kind==='aj',dev:l=>!!l.refund||l.kind==='dev'};

/* ----- Parcelas e empréstimos ----- */
function vParc(){
  const m=S.month,its=S.st.items.filter(x=>(x.inst?.tot||1)>1&&isDate(x.date));
  const rows=its.map(x=>{const f0=firstYM(x),k=diffM(f0,m),cur=x.inst.cur,tot=x.inst.tot,n=cur+k,end=lastYM(x),p=pay(x.pay);
    let sit,cls='';if(k<0){sit='ainda não começou'}else if(n>tot){sit='quitada';cls='good'}else if(n===tot){sit='última parcela';cls='good'}else{const f=tot-n;sit=f===1?'falta 1':'faltam '+f;cls='warn'}
    let rest=0;for(let j=Math.max(n,cur);j<=tot;j++)rest+=instAmt(x,j);
    const ab=x.refund&&+x.refund.amount>0?+x.refund.amount:0;
    return{x,n,tot,end,p,sit,cls,rest,ab,active:k>=0&&n<=tot,amt:k>=0&&n<=tot?instAmt(x,n):instAmt(x,Math.min(Math.max(n,1),tot)),fat:k>=0&&n<=tot?m:null}}).sort((a,b)=>(a.active===b.active?0:a.active?-1:1)||(a.end<b.end?1:-1));
  const act=rows.filter(r=>r.active),totM=sum(act,r=>r.amt),totAb=sum(act,r=>r.ab),totRest=sum(rows,r=>r.rest);
  const loans=S.st.loans.map(x=>({x,...loanInfo(x,m),p:pay(x.pay)}));

  const vC=months.map(mm=>sum(its,x=>{const k=diffM(firstYM(x),mm),n=x.inst.cur+k;return k>=0&&n<=x.inst.tot?instAmt(x,n)-(x.refund?+x.refund.amount||0:0):0}));
  const vL=months.map(mm=>sum(S.st.loans,x=>{const li=loanInfo(x,mm);return li.active?+x.parcela:0}));

  const cols=months.map((mm,i)=>{const t=vC[i]+vL[i];return `<div class="col" title="${ymL(mm)}: compras ${money(vC[i])} · empréstimos ${money(vL[i])}"><span class="val num">${t?short(t):''}</span><span class="bars" style="height:${t/mx*100}%"><i style="flex:${vL[i]};background:var(--c-loan)"></i><i style="flex:${vC[i]};background:var(--c-com)"></i></span><span class="t">${MES[+mm.slice(5)-1]}</span></div>`}).join('');

/* ----- Geral ----- */
function vGeral(){
  const st=S.st,cm=curYM();let end=addM(st.start,11);if(end<addM(cm,2))end=addM(cm,2);
  const ms=[];for(let m=st.start;m<=end;m=addM(m,1))ms.push(m);
  const rows=ms.map(m=>{const s=summary(m),c=carry(m),fl=c!==null?flow(m):null;const unpaid=fl?fl.cards.filter(x=>!x.bill):[],bad=unpaid.filter(x=>x.bal<0).length,paid=fl?fl.cards.filter(x=>x.bill).length:0;
    const sit=st.closed[m]?'<span class="pill">fechado</span>':m===cm?'<span class="pill info">mês atual</span>':m<cm?'<span class="pill warn">não fechado</span>':c!==null?'<span class="pill">próximo</span>':'<span class="pill">futuro</span>';
    const cut=sum(s.L.filter(l=>l.cut==='cor'&&EXP[l.kind]),l=>l.amount);
    const cardsCell=!fl?'—':!fl.cards.length?'<span class="muted">—</span>':bad?`<span class="pill bad">⚠ ${bad} sem dinheiro</span>`:paid===fl.cards.length?'<span class="pill">pagas</span>':'<span class="pill good">✔ ok</span>';
    return `<tr class="clk ${m===S.month?'sel':''}" data-act="goto" data-m="${m}"><td><b>${ymL(m)}</b></td><td class="l">${sit}</td><td class="num ${c===null?'na':''}">${c===null?'—':money(c)}</td><td class="num">${money(s.inT+s.dev)}</td><td class="num">${money(s.out)}</td><td class="num ${s.result<0?'neg':'pos'}">${money(s.result)}</td><td class="num ${c===null?'na':(c+s.cash<0?'neg':'')}"><b>${c===null?'—':money(c+s.cash)}</b></td><td class="l">${cardsCell}</td><td class="num">${money(s.inst+s.loanP)}</td><td class="num">${money(cut)}</td></tr>`}).join('');
  return `<section class="panel"><div class="panel-h"><h2>Visão geral</h2><span class="small muted">toque num mês para abrir</span></div>
    <p style="margin:0 0 4px;max-width:70ch">A sobra só passa de um mês para o seguinte: o mês atual mostra o que sobra para o próximo, e os meses depois disso só ganham saldo quando você fecha o anterior. Nos meses futuros aparece apenas o que já é certo: entradas e fixos cadastrados, parcelas e empréstimos.</p></section>
  <div class="tablewrap"><table><thead><tr><th>Mês</th><th class="l">Situação</th><th>Veio do anterior</th><th>Entradas</th><th>Gastos</th><th>Resultado</th><th>Sobra p/ o próximo</th><th class="l">Cartões no dia</th><th>Parcelas</th><th>Dava p/ cortar</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="small muted" style="margin:0">Resultado é renda menos gastos. A sobra também conta empréstimos recebidos, aplicações, resgates e ajustes.</p>`;
}

/* ----- Reduções ----- */
function vRed(){
  const st=S.st,cm=curYM();let m=S.month;if(!allowed(m))m=allowed(cm)?cm:st.start;const m2=addM(m,1);
  const red=st.reduce;
  const reducible=mm=>{const o={};for(const l of summary(mm).L)if((l.kind==='fix'||l.kind==='var')&&(l.cut==='red'||l.cut==='cor'))o[l.cat]=(o[l.cat]||0)+l.amount;return o};
  const r1=reducible(m),r2=reducible(m2);
  const cats=CATS_OUT.filter(c=>S.redAll||r1[c]||r2[c]);
  const sliders=cats.map(c=>{const p=Math.round((+red[c]||0)*100),sv=(r1[c]||0)*(p/100);return `<div class="redrow"><span><b>${esc(c)}</b><br><span class="small muted num">${money(r1[c]||0)} em ${ymL(m)}</span></span><input type="range" min="0" max="100" step="5" value="${p}" id="red-${esc(c)}" data-red="${esc(c)}" aria-label="Quanto reduzir em ${esc(c)}" ${S.ro?'disabled':''}><b class="num" style="text-align:right">${p}%</b><span class="sv num small pos" style="text-align:right">${sv?'− '+money(sv):''}</span></div>`}).join('')||'<div class="empty">Nenhum gasto marcado como "Reduzir" ou "Cortar" neste mês.</div>';
  const col=mm=>{const a=summary(mm),b=summary(mm,red),c=carry(mm),fa=flow(mm),fb=flow(mm,red);let cb=c;if(mm===m2&&c!==null&&carry(m)!==null)cb=carry(m)+summary(m,red).cash;return{a,b,c,cb,fa,fb}};
  const A=col(m),B=col(m2);
  const shift=(fl,dl)=>fl.cards.map(x=>({...x,bal:x.bal+dl}));
  const cardsB2=B.c!==null?shift(B.fb,(B.cb??0)-(B.c??0)):[];
  const cardRows=S.st.cards.map(cd=>{const g=arr=>arr.find(x=>x.card.id===cd.id);const a1=g(A.fa.cards),b1=g(A.fb.cards),a2=g(B.fa.cards),b2=g(cardsB2);
    const cell=(x,ok)=>x&&ok?`<td class="num ${x.bal<0?'neg':''}">${money(x.bal)}</td>`:'<td class="na">—</td>';
    return `<tr><td>${esc(cd.name)} no dia ${cd.dueDay}</td>${cell(a1,A.c!==null)}${cell(b1,A.c!==null)}${cell(a2,B.c!==null)}${cell(b2,B.c!==null)}</tr>`}).join('');
  const nx=(c,s)=>c===null?'—':money(c+s.cash);
  return `<section class="panel"><div class="panel-h"><h2>Quanto sobra se cortar</h2><span class="small muted">${ymL(m)} e ${ymL(m2)}</span></div>
    <p style="margin:0 0 6px;max-width:70ch">Diga quanto dá para diminuir em cada categoria. Só entram gastos marcados como <b>Reduzir</b> ou <b>Cortar</b>; parcelas, empréstimos e gastos essenciais ficam como estão.</p>
    ${sliders}<div style="margin-top:10px"><button class="link" data-act="redall">${S.redAll?'mostrar só as que têm gasto':'mostrar todas as categorias'}</button></div></section>
  <div class="tablewrap"><table class="cmp"><thead><tr><th></th><th>${ymL(m)} hoje</th><th>${ymL(m)} cortando</th><th>${ymL(m2)} hoje</th><th>${ymL(m2)} cortando</th></tr></thead><tbody>
    <tr><td>Gastos</td><td class="num">${money(A.a.out)}</td><td class="num after">${money(A.b.out)}</td><td class="num">${money(B.a.out)}</td><td class="num after">${money(B.b.out)}</td></tr>
    <tr><td>Economia</td><td></td><td class="num pos after">${money(A.a.out-A.b.out)}</td><td></td><td class="num pos after">${money(B.a.out-B.b.out)}</td></tr>
    <tr><td>Resultado do mês</td><td class="num">${money(A.a.result)}</td><td class="num after">${money(A.b.result)}</td><td class="num">${money(B.a.result)}</td><td class="num after">${money(B.b.result)}</td></tr>
    <tr><td><b>Sobra para o mês seguinte</b></td><td class="num">${nx(A.c,A.a)}</td><td class="num after pos">${nx(A.c,A.b)}</td><td class="num">${nx(B.c,B.a)}</td><td class="num after pos">${B.cb===null?'—':money(B.cb+B.b.cash)}</td></tr>
    ${cardRows}</tbody></table></div>
  <p class="small muted" style="margin:0">Só aparecem o mês atual e o próximo: mais adiante a conta dependeria de gastos que ainda não aconteceram.</p>`;
}

const cutSeg=sel=>`<div class="seg" id="cutSeg">${Object.entries(CUTS).map(([k,v])=>`<button type="button" aria-pressed="${sel===k}" data-act="cutpick" data-v="${k}"><span class="dot" style="background:var(${v.c})"></span>${v.l}</button>`).join('')}<button type="button" aria-pressed="${!sel}" data-act="cutpick" data-v="">Não sei</button></div>`;
const segPick=(name,opts,sel)=>`<div class="seg" data-seg="${name}">${opts.map(([k,l])=>`<button type="button" aria-pressed="${sel===k}" data-act="segpick" data-v="${k}">${l}</button>`).join('')}</div><input type="hidden" name="${name}" value="${sel}">`;
function typeTabs(kind,editing){if(editing)return'';return `<div class="typetabs">${[['var','Gasto'],['in','Entrada'],['fix','Gasto fixo'],['tra','Transferência'],['emp','Empréstimo'],['mov','Investimento']].map(([k,l])=>`<button type="button" aria-pressed="${kind===k}" data-act="swkind" data-v="${k}">${l}</button>`).join('')}</div>`}

function updVar(ev){
  const amt=parseMoney(fv('amount')),isI=fc('isInst'),imode=fv('imode'),tot=Math.max(2,parseInt(fv('tot'))||2),cur=Math.max(1,parseInt(fv('cur'))||1),date=fv('date'),p=pay(fv('pay'));
  if(ev&&(ev.target.name==='date'||ev.target.name==='pay')&&cur===1&&isDate(date)&&p){const b=F('bill');if(b)b.value=firstYM({date,pay:fv('pay'),bill:null})}
  const bill=fv('bill');
  $('#amtLbl').textContent=isI?(imode==='total'?'Valor total da compra':'Valor de cada parcela'):'Valor';
  const hint=$('#billHint');
  if(p&&isDate(date)){if(p.type==='card'){const f=isI&&isYM(bill)?addM(bill,-(cur-1)):cardDue(p.card,date);hint.textContent=`Mês da fatura: ${ymL(f)} (${p.card.name}, vence ${fD(dateIn(f,p.card.dueDay))}). Regra: ${cardRuleText(p.card)}.`}else hint.textContent=isWallet(p.acc)?'Sai da carteira no dia da compra.':`Sai da ${p.acc.name} no dia da compra.`}else hint.textContent='';
  const box=$('#instPrev');
  if(!isI||!(amt>0)||!isYM(bill)){box.innerHTML='';return}
  const total=imode==='total'?amt:amt*tot,x={total:imode==='total'?amt:null,amount:imode==='total'?round2(amt/tot):amt,inst:{tot,cur}};
  const p1=addM(bill,-(cur-1)),last=addM(bill,tot-cur),a1=instAmt(x,1),an=instAmt(x,tot);
  const chips=Array.from({length:Math.min(tot,36)},(_,j)=>`<span class="mchip ${j+1===cur?'now':''}">${j+1}/${tot} · ${ymS(addM(p1,j))}</span>`).join('')+(tot>36?'<span class="mchip">…</span>':'');
  box.innerHTML=`<div><b class="num">${tot}× de ${money(an)}</b> = <b class="num">${money(total)}</b>${Math.abs(a1-an)>0.001?` <span class="muted">(a 1ª fica ${money(a1)} por causa dos centavos)</span>`:''}</div>
    <div>1ª parcela em <b>${ymL(p1)}</b> · última em <b>${ymL(last)}</b>${cur>1?` · faltam ${tot-cur} depois desta`:''}</div><div class="mchips">${chips}</div>`;
}
function saveVar(){
  const amt=parseMoney(fv('amount')),date=fv('date');
  if(!(amt>0))return toast('Informe um valor maior que zero.');
  if(!fv('desc').trim())return toast('Diga o que foi.');
  if(!isDate(date))return toast('Informe a data.');
  if(!fv('pay'))return toast('Cadastre uma conta em Ajustes primeiro.');
  const it={...(sheetCtx.rec||{}),id:sheetCtx.id||uid(),t:'gas',date,desc:fv('desc').trim(),cat:fv('cat'),personId:fv('personId'),pay:fv('pay'),amount:round2(amt),cut:fv('cut')||null,inst:null,refund:null,bill:null,total:null};
  if(fc('isInst')){const cur=Math.max(1,parseInt(fv('cur'))||1),tot=Math.max(2,parseInt(fv('tot'))||2);if(cur>tot)return toast('A parcela atual não pode passar do total.');
    it.inst={cur,tot};if(fv('imode')==='total'){it.total=round2(amt);it.amount=round2(amt/tot)}
    const b=fv('bill'),auto=firstYM({...it,bill:null});it.bill=isYM(b)&&b!==auto?b:null;if(!it.cut)it.cut='com'}
  if(fc('isRef')){const ra=parseMoney(fv('ramt'));if(ra>0)it.refund={who:fv('rwho').trim(),amount:ra,received:fc('rrec')}}
  const isNew=!sheetCtx.rec,fm=firstYM(it);closeSheet();
  put(it,isNew&&fm!==S.month?`Lançado. Entra em ${ymL(fm)}${pay(it.pay)?.type==='card'?' (mês da fatura)':''}.`:isNew?'Lançado.':'Alterado.');
}

function saveRec(t){
  const amt=parseMoney(fv('amount'));if(!(amt>0))return toast('Informe um valor maior que zero.');if(!fv('desc').trim())return toast('Diga o que é.');

  if(t==='ent'){r.accountId=fv('accountId');r.once=!fc('rec');r.from=r.once?(fv('onceM')||S.month):(fv('from')||S.month);r.to=r.once?null:(fv('to')||null)}

async function aiRun(){
  const txt=fv('txt').trim();if(txt.length<20)return toast('Cole o texto do extrato.');
  const btn=$('#aiBtn'),out=$('#aiOut');btn.disabled=true;btn.textContent='Lendo…';out.innerHTML='<p class="small muted">Lendo o extrato…</p>';
  const prompt=`Você recebe o texto de uma fatura de cartão de crédito ou de um extrato bancário brasileiro.
Extraia somente as COMPRAS e DÉBITOS (dinheiro que saiu). Ignore: pagamentos da fatura, saldos, totais, limites, créditos, estornos, transferências recebidas, aplicações e resgates de poupança/investimento, e linhas de "saldo do dia".
Responda SOMENTE com um array JSON, um objeto por compra, assim:
[{"data":"2026-10-12","descricao":"Supermercado X","valor":123.45,"parcela":1,"total_parcelas":1,"categoria":"Mercado"}]
Regras: "data" no formato AAAA-MM-DD (se o ano não aparecer, use ${fv('year')}); "valor" positivo com ponto decimal, o valor da linha (numa linha parcelada, é o valor da parcela); "parcela" e "total_parcelas" só quando a linha indicar parcelamento (ex.: "Parcela 3/10" ou "3/10"), senão 1 e 1; "categoria" deve ser uma destas: ${CATS_OUT.join(', ')}. IOF e juros vão em "Tarifas e juros".

TEXTO:
${txt.slice(0,60000)}`;
  try{const arr=await S.sample.json(prompt,{modelTier:'default'});
    const rows=(Array.isArray(arr)?arr:[]).filter(r=>r&&+r.valor>0&&isDate(r.data||''));
    if(!rows.length){out.innerHTML='<p class="small">Não encontrei compras nesse texto. Confira se colou o extrato inteiro.</p>';btn.disabled=false;btn.textContent='Ler com IA';return}
    sheetCtx.rows=rows.map(r=>({date:r.data,desc:String(r.descricao||'Compra').slice(0,80),amount:+r.valor,cur:Math.max(1,parseInt(r.parcela)||1),tot:Math.max(1,parseInt(r.total_parcelas)||1),cat:CATS_OUT.includes(r.categoria)?r.categoria:'Outros'}));
    out.innerHTML=`<p class="small"><b>${rows.length}</b> compras encontradas, ${money(sum(sheetCtx.rows,r=>r.amount))}. Desmarque o que não quer importar.</p><div class="rows">${sheetCtx.rows.map((r,i)=>`<label class="row-i" style="grid-template-columns:auto minmax(0,1fr) auto"><input type="checkbox" checked data-ai="${i}" style="grid-row:1/span 2;width:18px;height:18px;accent-color:var(--accent)"><span class="d">${esc(r.desc)}</span><span class="a num">${money(r.amount)}</span><span class="m" style="grid-column:2">${fD(r.date)} · ${esc(r.cat)}${r.tot>1?` · parcela ${r.cur}/${r.tot}`:''}</span></label>`).join('')}</div>`;
    btn.disabled=false;btn.textContent='Importar selecionadas';btn.dataset.act='aiimport';
  }catch(e){const c=e&&e.code;out.innerHTML=`<p class="small" style="color:var(--bad)">${c==='not_granted'||c==='sampling_disabled'?'O Claude não está liberado para esta página.':c==='rate_limited'?'Muitos pedidos seguidos. Espere um pouco e tente de novo.':c==='prompt_too_large'?'O texto é grande demais. Cole uma parte de cada vez.':'Não consegui ler esse extrato. Tente de novo ou cole um trecho menor.'}</p>`;btn.disabled=false;btn.textContent='Ler com IA'}
}
function aiImport(){
  const p=fv('pay'),pi=pay(p),fat=fv('fat'),list=[];
  for(const box of dlg.querySelectorAll('[data-ai]')){if(!box.checked)continue;const r=sheetCtx.rows[+box.dataset.ai];
    const it={t:'gas',date:r.date,desc:r.desc,cat:r.cat,personId:'',pay:p,amount:r.amount,cut:r.tot>1?'com':(CAT_CUT[r.cat]||null),inst:r.tot>1?{cur:Math.min(r.cur,r.tot),tot:r.tot}:null,refund:null,bill:null,total:null};
    if(pi?.type==='card'&&isYM(fat)){const auto=firstYM(it);if(auto!==fat)it.bill=fat}
    list.push(it)}
  closeSheet();putMany(list);toast(`${list.length} lançamentos importados.`);
}

/* ---------- ações ---------- */
function setFilter(k,v){S.f={kind:'all',cut:null,person:null,pay:null,cat:null,q:''};if(k==='kind')S.f.kind=v;else S.f[k]=v;S.tab='lanc';render();window.scrollTo({top:0})}
function openEdit(t){
  const k=t.dataset.kind,r=S.recs[t.dataset.id];
  if(k==='fd')return formFat(t.dataset.card,t.dataset.ym);
  if(!r)return;
  ({in:formIn,fix:formFix,var:formVar,dev:formVar,loan:formEmp,loanin:formEmp,tr:formTra,apl:formMov,res:formMov,ren:formMov,aj:formCon,inv:formInv,car:formCard})[k]?.(r);
}
function guard(){if(S.ro&&S.mode!=='demo'){toast(RO_MSG);return false}return true}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  switch(a){
    case'tab':S.tab=t.dataset.tab;render();window.scrollTo({top:0});break;
    case'mprev':S.month=addM(S.month,-1);render();break;
    case'mnext':S.month=addM(S.month,1);render();break;
    case'mtoday':S.month=curYM();render();break;
    case'goto':S.month=t.dataset.m;S.tab='mes';render();window.scrollTo({top:0});break;
    case'filter':setFilter(t.dataset.k,t.dataset.v);break;
    case'fk':S.f.kind=t.dataset.v;render();break;
    case'fc':S.f.cut=S.f.cut===t.dataset.v?null:t.dataset.v;render();break;
    case'clearf':S.f={kind:'all',cut:null,person:null,pay:null,cat:null,q:''};render();break;
    case'toggletable':S.showTable=!S.showTable;render();break;
    case'fresh':if(!S.dbChecked)break;startWith(freshRecs());S.tab='ajustes';toast('Pronto. Cadastre pessoas, contas e cartões.');break;
    case'keepdemo':if(!S.dbChecked)break;startWith(Object.values(S.recs).map(r=>({...r,c:null,by:null})));toast('O exemplo agora é seu. Troque os nomes e valores.');break;
    case'add':if(!guard())break;if(!S.st.accounts.length){S.tab='ajustes';render();toast('Cadastre uma conta primeiro.');break}formVar(null);break;
    case'swkind':newForm(t.dataset.v);break;
    case'new':if(!guard())break;newForm(t.dataset.kind);break;
    case'newtr':if(!guard())break;formTra(null,{from:t.dataset.from,to:t.dataset.to,v:+t.dataset.v});break;
    case'newcon':if(!guard())break;formCon(null,t.dataset.acc);break;
    case'newmov':if(!guard())break;formMov(null,t.dataset.k);break;
    case'newinv':if(!guard())break;formInv(null);break;
    case'newcard':if(!guard())break;formCard(null);break;
    case'paybill':formFat(t.dataset.card,t.dataset.ym);break;
    case'edit':openEdit(t);break;
    case'closesheet':closeSheet();break;
    case'delsheet':delAsk(t,()=>sheetCtx?.del?.());break;
    case'cutpick':{const box=t.closest('#cutSeg');box.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t));F('cut').value=t.dataset.v;if(sheetCtx)sheetCtx.cutTouched=true;break}
    case'segpick':{const box=t.closest('[data-seg]');box.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t));F(box.dataset.seg).value=t.dataset.v;sheetCtx?.upd?.();break}
    case'cardpreset':{F('rule').value=t.dataset.r;dlg.querySelectorAll('[data-seg="rule"] button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===t.dataset.r));F('cday').value=t.dataset.d;F('due').value=t.dataset.v;F('dueNext').value='auto';sheetCtx?.upd?.();break}
    case'toggle':{const box=document.getElementById(t.dataset.t);if(box)box.hidden=!t.checked;if(t.dataset.t==='recBox'){const o=document.getElementById('onceBox');if(o)o.hidden=t.checked}if(t.dataset.t==='instBox'&&t.checked&&sheetCtx&&!sheetCtx.cutTouched){dlg.querySelectorAll('#cutSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v==='com'));F('cut').value='com'}sheetCtx?.upd?.();break}
    case'stoprec':{const x=sheetCtx?.rec;if(x){closeSheet();put({...x,to:addM(S.month,-1)},`Termina em ${ymL(addM(S.month,-1))}.`)}break}
    case'close':closeMonthSheet();break;
    case'reopen':if(guard())drop('mes-'+S.month,`${ymL(S.month)} reaberto.`);break;
    case'redall':S.redAll=!S.redAll;render();break;
    case'addset':{if(!guard())break;const w=t.dataset.what,st=S.st;if(w==='pes')put({t:'pes',name:'Nova pessoa',o:st.people.length+1});else put({t:'cta',name:'Nova conta',type:'banco',personId:'',initial:0,o:st.accounts.length+1});break}
    case'delset':{if(!guard())break;const id=t.dataset.id,r=S.recs[id],st=S.st;if(!r)break;
      if(r.t==='cta'){const used=st.incomes.filter(x=>x.accountId===id).length+[...st.fixed,...st.items,...st.loans].filter(x=>x.pay==='a:'+id).length+st.cards.filter(c=>c.accountId===id).length+st.transfers.filter(x=>x.from===id||x.to===id).length+st.loans.filter(x=>x.accId===id).length+st.moves.filter(x=>x.accId===id).length+st.confs.filter(x=>x.accId===id).length;
        if(used){toast(`Esta conta está em ${used} ${used===1?'lugar':'lugares'}. Troque esses lançamentos antes de remover.`);break}drop(id,'Removida.')}
      else if(r.t==='pes'){const refs=[...st.incomes,...st.fixed,...st.items,...st.accounts,...st.loans,...st.invs].filter(x=>x.personId===id).map(x=>({...x,personId:''}));if(refs.length)putMany(refs);drop(id,'Removida.')}
      break}
    case'backup':backup();break;
    case'restore':$('#fileIn').click();break;
    case'restore0':S.pendingRestore=null;render();break;
    case'restore2':replaceAll(S.pendingRestore);S.pendingRestore=null;break;
    case'wipe':$('#wipeBox').innerHTML=`<div class="banner bad" style="margin-top:12px"><p>Isso apaga todos os lançamentos${S.mode==='db'?' do banco da casa, para todos':' deste navegador'}. Não dá para desfazer.</p><button class="btn danger" data-act="wipe2">Apagar tudo agora</button></div>`;break;
    case'wipe2':wipe();break;
    case'ai':aiSheet();break;
    case'airun':aiRun();break;
    case'aiimport':aiImport();break;
    case'csv':csv();break;
    case'reload':location.reload();break;
    case'authmode':S.authMode=t.dataset.v;render();break;
    case'logout':if(FB)FB.auth.signOut();break;
    case'mkinvite':mkInvite(t);break;
    case'copyinv':{const tx=inviteText();if(navigator.clipboard)navigator.clipboard.writeText(tx).then(()=>toast('Convite copiado. Cole no WhatsApp da pessoa.'),()=>toast('Não deu para copiar. Mande o código: '+(S.invite?.code||'')));else toast('Mande o código: '+(S.invite?.code||''));break}
    case'install':if(S.installEvt){S.installEvt.prompt();S.installEvt.userChoice?.finally(()=>{S.installEvt=null;scheduleRender()})}break;
  }
});
document.addEventListener('submit',e=>{const f=e.target;if(f.classList&&f.classList.contains('gateform')){e.preventDefault();gateSubmit(f)}});
dlg.addEventListener('submit',e=>{e.preventDefault();if(S.ro&&S.mode!=='demo'){toast(RO_MSG);return}sheetCtx?.save?.()});
dlg.addEventListener('input',e=>{sheetCtx?.upd?.(e)});
dlg.addEventListener('change',e=>{
  const t=e.target;if(!sheetCtx)return;
  if(t.name==='cat'&&sheetCtx.kind==='var'&&!sheetCtx.cutTouched){const v=fc('isInst')?'com':(CAT_CUT[t.value]||'');F('cut').value=v;dlg.querySelectorAll('#cutSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v))}
  sheetCtx.upd?.(e);
});
let qT,rT;
document.addEventListener('input',e=>{
  const t=e.target;if(dlg.contains(t))return;
  if(t.id==='fQ'){clearTimeout(qT);qT=setTimeout(()=>{S.f.q=t.value;scheduleRender()},250);return}
  if(t.dataset.red!=null){t.nextElementSibling.textContent=t.value+'%';const cat=t.dataset.red,v=(+t.value)/100;clearTimeout(rT);rT=setTimeout(()=>{const c=S.recs.cfg||{id:'cfg',t:'cfg',start:S.st.start};put({...c,reduce:{...S.st.reduce,[cat]:v}})},350);return}
});
document.addEventListener('change',e=>{
  const t=e.target;if(dlg.contains(t))return;
  if(t.id==='fPerson'){S.f.person=t.value||null;render();return}
  if(t.id==='fPay'){S.f.pay=t.value||null;render();return}
  if(t.id==='fCat'){S.f.cat=t.value||null;render();return}
  if(t.dataset.set==='start'){if(isYM(t.value)){const c=S.recs.cfg||{id:'cfg',t:'cfg',reduce:S.st.reduce};put({...c,start:t.value},'Início do controle alterado.');if(DB.db&&S.mode==='db')subscribeAll()}return}
  if(t.dataset.set){const r=S.recs[t.dataset.id];if(!r)return;let v=t.value;
    if(t.dataset.money!=null){v=parseMoney(v);if(isNaN(v))v=0}
    put({...r,[t.dataset.f]:v});return}
});
$('#fileIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());let recs=null;
    if(j&&Array.isArray(j.recs))recs=j.recs.filter(r=>r&&r.id&&r.t);else if(j&&Array.isArray(j.accounts))recs=v1ToRecs(j);
    if(!recs||!recs.length)throw 0;
    if(S.mode==='demo'){startWith(recs);toast('Backup restaurado.')}else{S.pendingRestore=recs;S.tab='ajustes';render()}
  }catch(_){toast('Esse arquivo não é um backup do Caixa em Dia.')}});
async function deleteAllDb(){const paths=Object.values(S.recs).map(recPath);await Promise.all(paths.map(p=>dbDel(p)))}
async function replaceAll(recs){
  if(!guard())return;
  if(S.mode==='db'&&DB.db){S.wiping=true;try{await deleteAllDb()}finally{S.wiping=false}}
  S.recs={};await putMany(recs);toast('Backup restaurado.');
}
async function backup(){if(!S.downloads)return;try{await S.downloads.save({filename:`caixa-em-dia-backup-${today()}.json`,data:JSON.stringify({v:2,recs:Object.values(S.recs)},null,1)});toast('Backup baixado.')}catch(e){if(e&&e.code!=='declined')toast('Não foi possível baixar agora.')}}
async function csv(){if(!S.downloads)return;const L=filteredLines();const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const KN={in:'Entrada',dev:'Devolução',fix:'Gasto fixo',var:'Gasto',loan:'Parcela de empréstimo',loanin:'Empréstimo recebido',tr:'Transferência',apl:'Aplicação',res:'Resgate',aj:'Ajuste de saldo',fd:'Diferença de fatura'};
  const rows=[['Data','Tipo','Descrição','Categoria','Pessoa','Pagamento','Mês da fatura','Parcela','Dá para cortar','Valor']].concat(L.map(l=>[l.date?fDY(l.date):'sem dia',KN[l.kind]||l.kind,l.desc,l.cat,pname(l.person),l.via,l.card?ymL(S.month):'',l.inst?`${l.inst.n}/${l.inst.tot}`:'',l.cut&&EXP[l.kind]?CUTS[l.cut].l:'',l.kind==='tr'?l.amount:val(l)]));
  const txt='﻿'+rows.map((r,ri)=>r.map((v,i)=>i===9&&ri>0?String(round2(v)).replace('.',','):q(v)).join(';')).join('\n');
  try{await S.downloads.save({filename:`lancamentos-${S.month}.csv`,data:txt})}catch(e){if(e&&e.code!=='declined')toast('Não foi possível baixar agora.')}}
async function wipe(){
  if(!guard())return;
  if(S.mode==='db'&&DB.db){S.wiping=true;try{await deleteAllDb()}catch(e){S.wiping=false;toast('Não consegui apagar tudo. Tente de novo.');return}}
  lsDel(LS1);lsDel(LS2);S.mode='demo';S.tab='mes';setRecs(demoRecs());S.wiping=false;toast('Tudo apagado.');
}
window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{if(S.tab==='mes')drawFlow()},150)});

/* ---------- início ---------- */
(function boot(){
  S.downloads={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:/\.csv$/.test(filename)?'text/csv;charset=utf-8':'application/json'}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}};
  if(new URLSearchParams(location.search).get('c'))S.authMode='signup';
  setRecs(demoRecs());render();
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.installEvt=e;scheduleRender()});
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
  fbInit();
})();
</script>
